[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cds-diagnosis"
version = "1.0.0"
description = "AI-Driven Clinical Decision Support for Disease Diagnosis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.19.0",
    "scipy>=1.5.0",
    "scikit-learn>=0.23.0",
    "nltk>=3.9.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
bert = [
    "transformers>=4.21.0",
    "torch>=1.12.0",
    "sentence-transformers>=2.2.0",
    "accelerate>=0.12.0",
]
# The BioSentVec baseline. Needs Python 3.9 and a C toolchain; see
# docs/guides/setup.md. Kept separate so the BERT arm never requires it.
#
# `sent2vec` on PyPI is an UNRELATED project that exposes no Sent2vecModel
# class -- installing it is what produced the archived
# `AttributeError: module 'sent2vec' has no attribute 'Sent2vecModel'`
# (archive/baseline_debug.txt). The baseline needs epfml/sent2vec from source,
# which is what config/requirements.txt already pointed at while this file and
# config/environment.yml both named the wrong package.
baseline = [
    "gensim>=3.8.0",
    "sent2vec @ git+https://github.com/epfml/sent2vec.git",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
# A real src-layout. Before this, `where = ["."]` + `include = ["src*"]`
# published a distribution package literally named `src`, and `aicds` was
# importable only because the repo root happened to be on sys.path.
where = ["src"]
include = ["aicds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" makes the `aicds` package importable; "." keeps the repo root there so
# tests can import their own helpers (`from tests.stubs import StubEncoder`).
pythonpath = [".", "src"]
markers = [
    "network: needs internet (downloads models from HuggingFace)",
    "slow: takes minutes — full pipeline runs",
    "golden: byte-compares output against a committed reference run",
]
# Network and slow tests are both opt-in. The golden regression runs the full
# 10-fold pipeline and takes 42-53 minutes (measured 42:28, 43:28, 43:50, 44:32, ~50:00
# 52:35 and 53:10 -- NOT the ~26 minutes this comment used to claim), so a bare
# `pytest` must not include it or nobody will run tests at all.
#   pytest              fast unit + characterization  (~4s)
#   pytest -m golden    the byte-exact pipeline regression
#   pytest -m network   the HuggingFace download smoke test
addopts = "-m 'not network and not slow'"
