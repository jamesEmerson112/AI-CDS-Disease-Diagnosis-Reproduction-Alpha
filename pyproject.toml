[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cds-diagnosis"
version = "1.0.0"
description = "AI-Driven Clinical Decision Support for Disease Diagnosis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.19.0",
    "scipy>=1.5.0",
    "scikit-learn>=0.23.0",
    "nltk>=3.9.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
bert = [
    "transformers>=4.21.0",
    "torch>=1.12.0",
    "sentence-transformers>=2.2.0",
    "accelerate>=0.12.0",
]
# The BioSentVec baseline. Needs Python 3.9 and a C toolchain; see
# docs/guides/setup.md. Kept separate so the BERT arm never requires it.
baseline = [
    "gensim>=3.8.0",
    "sent2vec>=0.1.3",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on sys.path so tests import `src.*` without the
# sys.path.insert boilerplate each file currently repeats.
pythonpath = ["."]
markers = [
    "network: needs internet (downloads models from HuggingFace)",
    "slow: takes minutes — full pipeline runs",
    "golden: byte-compares output against a committed reference run",
]
# Network tests are opt-in: `pytest -m network` to include them.
addopts = "-m 'not network'"
